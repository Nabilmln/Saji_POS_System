name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  NEON_AUTH_BASE_URL: https://example.invalid/neon-auth
  NEON_AUTH_JWKS_URL: https://example.invalid/neon-auth/jwks
  NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-at-least-32-characters
  CUSTOMER_TOKEN_SECRET: ci-only-customer-token-secret-with-at-least-32-characters

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest unit tests
        run: npm test

  build:
    name: Production Build Check
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Next.js build
        run: npm run build

  integration:
    name: Database & HTTP Integration
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare local PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/db/local-auth-stub.sql
          npm run db:migrate
          npm run db:seed
          npm run db:health
      - name: Build Next.js application
        run: npm run build
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saji_e2e
        run: npm run test:integration

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser and OS dependencies (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium --only-shell

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium --only-shell

      - name: Build Next.js application
        run: npm run build

      - name: Browser workflows and accessibility
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saji_e2e
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    name: CI Completion Gate
    runs-on: ubuntu-latest
    needs: [quality, build, integration, e2e]
    if: always()
    steps:
      - name: Evaluate status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All checks passed successfully."
